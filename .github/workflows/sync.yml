name: Sincronizar Catalogo Telegram

on:
  schedule:
    # Se ejecuta automáticamente cada 3 horas
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite ejecutar manualmente con un clic en GitHub

permissions:
  contents: write

concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Sincronización
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          MOVIES_SOURCE_CHAT: "-1001905652210"
          MOVIES_SOURCE_TOPIC: "1605935"
          MOVIES_DEST_CHAT: "-1002146236969"
          SERIES_SOURCE_CHAT: "-1002257262928"
          SERIES_SOURCE_TOPIC: "157592"
          SERIES_DEST_CHAT: "-1002097175258"
        run: |
          python sync_bot.py

      - name: Guardar estado de sincronización
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sync_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sync state [skip ci]" && git push)
