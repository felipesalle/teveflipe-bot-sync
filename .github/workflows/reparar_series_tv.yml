name: Reparar Catalogo Series TV

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo simulado (Dry Run - true para solo ver cambios sin borrar ni mover)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install telethon

      - name: Ejecutar Reparación de Series TV
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python reparar_catalogo_series_tv.py

      - name: Guardar Estado Corregido en Repositorio
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sync_state.json
          git commit -m "Corregir catálogo de series TV y limpiar temas erróneos [skip ci]" || exit 0
          git pull --rebase origin main
          git push
