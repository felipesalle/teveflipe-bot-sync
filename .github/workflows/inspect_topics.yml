name: Inspeccionar Temas

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install telethon

      - name: Listar todos los temas del supergrupo destino
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TARGET_CHAT: "-1002097175258"
        run: |
          python - << 'EOF'
          import asyncio
          import os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.functions.messages import GetForumTopicsRequest

          API_ID = int(os.environ["TELEGRAM_API_ID"])
          API_HASH = os.environ["TELEGRAM_API_HASH"]
          SESSION = os.environ["TELEGRAM_STRING_SESSION"]
          TARGET = int(os.environ["TARGET_CHAT"])

          async def main():
              async with TelegramClient(StringSession(SESSION), API_ID, API_HASH) as client:
                  chat = await client.get_entity(TARGET)
                  print(f"=== SUPERGRUPO: {chat.title} (ID: {chat.id}) ===")
                  
                  offset_date = None
                  offset_id = 0
                  offset_topic = 0
                  all_topics = []
                  while True:
                      res = await client(GetForumTopicsRequest(
                          peer=chat,
                          offset_date=offset_date,
                          offset_id=offset_id,
                          offset_topic=offset_topic,
                          limit=100
                      ))
                      if not res.topics:
                          break
                      all_topics.extend(res.topics)
                      if len(res.topics) < 100:
                          break
                      last = res.topics[-1]
                      offset_topic = last.id
                      offset_id = last.top_message
                      offset_date = last.date

                  print(f"Total temas encontrados: {len(all_topics)}")
                  for t in all_topics:
                      count = 0
                      first_msg = ""
                      async for m in client.iter_messages(chat, reply_to=t.id, limit=3):
                          count += 1
                          if not first_msg and m.file and m.file.name:
                              first_msg = m.file.name
                          elif not first_msg and m.text:
                              first_msg = m.text[:40].replace('\n', ' ')
                      print(f"-> ID: {t.id} | Titulo: '{t.title}' | Msgs: {count} | Muestra: {first_msg}")

          asyncio.run(main())
          EOF
