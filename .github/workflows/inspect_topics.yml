name: Inspeccionar Temas

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install telethon

      - name: Listar todos los temas del supergrupo destino
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TARGET_CHAT: "-1004419790119"
        run: |
          python - << 'EOF'
          import asyncio
          import os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.functions.messages import GetForumTopicsRequest

          API_ID = int(os.environ["TELEGRAM_API_ID"])
          API_HASH = os.environ["TELEGRAM_API_HASH"]
          SESSION = os.environ["TELEGRAM_STRING_SESSION"]
          TARGET = int(os.environ["TARGET_CHAT"])

          async def main():
              async with TelegramClient(StringSession(SESSION), API_ID, API_HASH) as client:
                  chat = await client.get_entity(TARGET)
                  print(f"=== SUPERGRUPO: {chat.title} (ID: {chat.id}) ===")
                  
                  res = await client(GetForumTopicsRequest(
                      peer=chat,
                      offset_date=None,
                      offset_id=0,
                      offset_topic=0,
                      limit=100
                  ))
                  print(f"Total temas encontrados: {len(res.topics)}")
                  for t in res.topics:
                      print(f"-> Topic ID: {t.id} | Title: '{t.title}' | Closed: {t.closed} | Hidden: {t.hidden} | TopMsg: {t.top_message}")

          asyncio.run(main())
          EOF
