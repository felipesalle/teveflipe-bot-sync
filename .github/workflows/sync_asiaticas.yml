name: Sincronizar Series Asiaticas

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Cantidad de series a procesar en esta ejecución'
        required: false
        default: '15'

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install telethon

      - name: Sincronizar Lote de Series Asiáticas
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          SERIES_BATCH_LIMIT: ${{ github.event.inputs.batch_limit || '15' }}
        run: |
          python sync_asiaticas.py

      - name: Guardar Progreso de Sincronización
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add sync_state_asiaticas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "progreso: sincronizacion series asiaticas [skip ci]" && git push)
