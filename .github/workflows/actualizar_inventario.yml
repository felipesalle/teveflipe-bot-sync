name: Generar y Actualizar Inventario de Producción

on:
  schedule:
    # Se ejecuta todos los domingos o a demanda
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade --no-cache-dir "telethon>=1.40.0"

      - name: Ejecutar Indexación de Producción
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_PROD: ${{ secrets.SESSION_PROD }}
        run: |
          python generar_inventario_produccion.py

      - name: Guardar Inventario en Repositorio
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f inventario_produccion.json ]; then
            git add inventario_produccion.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: actualizar inventario maestro de produccion [skip ci]"
              git pull --rebase --autostash origin main
              git push origin main
            fi
          fi
