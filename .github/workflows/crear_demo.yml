name: Crear y Configurar Grupos Demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install telethon

      - name: Ejecutar Creacion de Grupos Demo
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          MOVIES_SRC_CHAT: "-1002146236969"
          SERIES_SRC_CHAT: "-1002097175258"
          SPANISH_SRC_CHAT: "-1004419790119"
        run: python crear_grupos_demo.py

      - name: Guardar configuracion demo
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f demo_config.json ]; then
            git add demo_config.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update demo config [skip ci]"
              git pull --rebase --autostash origin main
              git push origin main
            fi
          fi
