name: Copiar Peliculas al Bunker

on:
  workflow_dispatch:
  schedule:
    # Ejecutar cada 6 horas para continuar automáticamente hasta completar
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync-movies:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install telethon

      - name: Ejecutar Replicación de Películas
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_BUNKER: ${{ secrets.SESSION_BUNKER }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          MAX_RUN_SECONDS: 19800  # 5.5 horas de ejecución continua
        run: python copiar_peliculas_bunker.py

      - name: Guardar Progreso en el Repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add copia_todas_peliculas_state.json
          git commit -m "chore: actualizar estado de peliculas copiadas [skip ci]" || echo "Sin cambios"
          git push origin main || echo "No se pudo hacer push"
