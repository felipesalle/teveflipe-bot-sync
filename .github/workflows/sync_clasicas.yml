name: Sincronizar Peliculas Clasicas

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  sync_clasicas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Sincronización de Películas Clásicas
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          CLASICAS_SOURCE_CHAT: "-1001905652210"
          CLASICAS_SOURCE_TOPIC: "7"
          BATCH_FORWARD_LIMIT: "50"
          MAX_MESSAGES_TO_SCAN: "20000"
        run: |
          python sync_peliculas_clasicas.py

      - name: Guardar estado de sincronización
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sync_state_clasicas.json ]; then
            git add sync_state_clasicas.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update sync state peliculas clasicas [skip ci]"
              git pull --rebase --autostash origin main
              git push origin main
            fi
          fi

      - name: Encadenar siguiente tanda si quedan películas
        if: always()
        run: |
          if [ -f .more_clasicas ]; then
            echo "Quedan películas pendientes. Esperando 15 segundos antes de disparar siguiente ejecución..."
            sleep 15
            gh workflow run sync_clasicas.yml || true
          else
            echo "No hay más películas clásicas pendientes."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
