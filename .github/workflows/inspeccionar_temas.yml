name: Inspeccionar Temas Afectados

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install telethon
      - name: Ejecutar Inspección
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          SERIES_DEST_CHAT: "-1002097175258"
        run: python inspeccionar_temas_afectados.py
      - name: Guardar Diagnostico
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostico_temas_afectados.json
          git commit -m "Diagnostico temas afectados [skip ci]" || exit 0
          git pull --rebase origin main
          git push
