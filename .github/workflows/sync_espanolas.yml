name: Sincronizar Series Espanolas

on:
  schedule:
    # Se ejecuta cada 25 minutos automáticamente
    - cron: '*/25 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Sincronizacion de Series Espanolas
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          SERIES_SOURCE_CHAT: "-1002160549536"
          SERIES_SOURCE_TOPIC: "21"
          SERIES_DEST_CHAT: "-1004419790119"
          BATCH_FORWARD_LIMIT: "200"
        run: |
          python sync_series_espanolas.py

      - name: Guardar estado de sincronizacion
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add sync_state_espanolas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sync state series espanolas [skip ci]" && git push)

      - name: Encadenar siguiente tanda si quedan episodios
        if: always()
        run: |
          if [ -f .more_episodes ]; then
            echo "Quedan episodios pendientes. Disparando siguiente ejecución..."
            gh workflow run sync_espanolas.yml || true
          else
            echo "No hay más episodios pendientes."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
