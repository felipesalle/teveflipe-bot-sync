name: Auditoría de Novedades Búnker (Solo Lectura)

on:
  workflow_dispatch:

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit_novedades:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade --no-cache-dir "telethon>=1.40.0"

      - name: Ejecutar Auditoría de Novedades
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_BUNKER: ${{ secrets.SESSION_BUNKER }}
          SESSION_PROD: ${{ secrets.SESSION_PROD }}
        run: |
          python auditar_novedades_pendientes.py
