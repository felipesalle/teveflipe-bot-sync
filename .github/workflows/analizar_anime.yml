name: Analizar Canal y Tema Anime

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'ID del Chat / Supergrupo'
        required: false
        default: '-1002257262928'
      topic_id:
        description: 'ID del Tema / Topic'
        required: false
        default: '316312'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install telethon

      - name: Ejecutar Auditoría Anime
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TARGET_CHAT_ID: ${{ inputs.chat_id || '-1002257262928' }}
          TARGET_TOPIC_ID: ${{ inputs.topic_id || '316312' }}
        run: |
          python analizar_anime.py

      - name: Guardar Informe y Datos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add analisis_anime.json INFORME_ANIME.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar auditoría e informe anime [skip ci]" && git push)
