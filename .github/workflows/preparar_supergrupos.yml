name: Preparar 4 Supergrupos de Series en Telegram

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install telethon

      - name: Ejecutar Preparador de Supergrupos
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          python preparar_supergrupos_series.py

      - name: Guardar Configuración Generada
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config_supergrupos_series.json || true
          git commit -m "config: supergrupos de series creados y enlaces exportados [skip ci]" || exit 0
          git pull --rebase origin main
          git push
