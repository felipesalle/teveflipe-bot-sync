name: Sincronizar Cine de los 80 y 90

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  sync_80_90:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Sincronización Cine de los 80 y 90
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          MOVIES_80_90_SOURCE_CHAT: "-1001905652210"
          MOVIES_80_90_SOURCE_TOPIC: "7"
          BATCH_FORWARD_LIMIT: "50"
          MAX_MESSAGES_TO_SCAN: "20000"
        run: |
          python sync_peliculas_80_90.py

      - name: Guardar estado de sincronización
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sync_state_80_90.json ]; then
            git add sync_state_80_90.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update sync state cine 80 y 90 [skip ci]"
              git pull --rebase --autostash origin main
              git push origin main
            fi
          fi

      - name: Encadenar siguiente tanda si quedan películas
        if: always()
        run: |
          if [ -f .more_80_90 ]; then
            echo "Quedan películas de los 80 y 90 pendientes. Esperando 15 segundos antes de disparar siguiente ejecución..."
            sleep 15
            gh workflow run sync_80_90.yml || true
          else
            echo "No hay más películas pendientes de los 80 y 90."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
