name: Ejecutar Piloto Real Multipart HD4K

on:
  workflow_dispatch:

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run_pilot:
    name: "Piloto Real HD/4K La Bella y la Bestia"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade --no-cache-dir "telethon>=1.40.0" requests

      - name: Ejecutar Piloto HD/4K Real
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_BUNKER: ${{ secrets.SESSION_BUNKER }}
          SESSION_PROD: ${{ secrets.SESSION_PROD }}
        run: |
          python ejecutar_piloto_hd4k_real.py

      - name: Subir artefacto de resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-piloto-hd4k
          path: resultado_piloto_hd4k.json
