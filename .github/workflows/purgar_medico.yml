name: Purgar Temas Anómalos Médico de Familia

on:
  workflow_dispatch:

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purgar_temas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade --no-cache-dir "telethon>=1.40.0"

      - name: Ejecutar Purga de Temas
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_PROD: ${{ secrets.SESSION_PROD }}
          COMMUNITY_GROUP_ID: "-1003990716596"
          COMMUNITY_TOPIC_ID: "22"
        run: |
          python purgar_temas_medico.py
