name: Motor Maestro de Sincronización HD/4K (Migración e Incremental)

on:
  schedule:
    # Sincronización incremental periódica cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución (--migrate para histórico, --incremental para novedades)'
        required: true
        default: '--migrate'
        type: choice
        options:
          - '--migrate'
          - '--incremental'
      max_works:
        description: 'Máximo número de obras por lote en esta ejecución'
        required: false
        default: '15'
        type: string

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync_hd4k:
    name: "Sincronizador Maestro HD/4K TeVeFLIPE"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade --no-cache-dir "telethon>=1.40.0" requests

      - name: Ejecutar Sincronización Maestro HD/4K
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_BUNKER: ${{ secrets.SESSION_BUNKER }}
          SESSION_PROD: ${{ secrets.SESSION_PROD }}
          MAX_BATCH_WORKS: ${{ github.event.inputs.max_works || '15' }}
        run: |
          python migrar_hd4k_maestro.py ${{ github.event.inputs.mode || '--migrate' }}

      - name: Guardar estado permanente en repositorio
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sync_hd4k_state.json ]; then
            git add sync_hd4k_state.json
            if ! git diff --staged --quiet; then
              git commit -m "auto: persistencia de estado sync_hd4k_state.json [skip ci]"
              git pull --rebase --autostash origin main
              git push origin main
            fi
          fi

      - name: Subir artefacto de estado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estado-sync-hd4k
          path: sync_hd4k_state.json
