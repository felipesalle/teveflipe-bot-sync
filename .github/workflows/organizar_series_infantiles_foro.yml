name: Organizar Series Infantiles en Foro

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  organizar_foro:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Organizador de Foro
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          CANAL_SERIES_ID: "-1003874872975"
        run: |
          python organizar_series_infantiles_foro.py

      - name: Guardar Estado y Temas en Repositorio
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add foro_infantil_state.json index_episodios_infantiles.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update foro infantil state [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
