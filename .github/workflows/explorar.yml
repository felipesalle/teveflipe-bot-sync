name: Explorar Nuevo Grupo de Telegram

on:
  workflow_dispatch:
    inputs:
      target_chat:
        description: 'ID del chat a explorar'
        required: true
        default: '-1002160549536'

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Explorar Grupo
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TARGET_CHAT_ID: ${{ github.event.inputs.target_chat || '-1002160549536' }}
        run: |
          python ver_series_espanolas.py

      - name: Guardar Informe de Exploracion
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add EXPLORACION_GRUPO.md exploracion_grupo.json EXPLORACION_DETALLADA.md exploracion_detallada.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar exploracion de nuevo grupo [skip ci]" && git push)
