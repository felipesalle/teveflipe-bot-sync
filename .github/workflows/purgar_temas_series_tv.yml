name: Purgar Temas Anomalos Series TV

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install telethon
      - name: Ejecutar Purga de Temas Anómalos
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          SERIES_DEST_CHAT: "-1002097175258"
        run: python purgar_temas_series_tv.py
      - name: Guardar Estado Saneado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sync_state.json
          git commit -m "Purgar temas anomalos de Series TV y resetear estado [skip ci]" || exit 0
          git pull --rebase origin main
          git push
