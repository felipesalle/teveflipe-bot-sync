name: Censo y Auditoría Canal Partes

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a realizar'
        required: true
        default: 'censo_total'
        type: choice
        options:
          - 'censo_total'
          - 'auditoria_cabeceras'

permissions:
  contents: write

jobs:
  run_task:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade --no-cache-dir "telethon>=1.40.0" requests

      - name: Ejecutar Tarea
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_BUNKER: ${{ secrets.SESSION_BUNKER }}
          SESSION_PROD: ${{ secrets.SESSION_PROD }}
          CHOSEN_ACTION: ${{ inputs.action }}
        run: |
          if [ "$CHOSEN_ACTION" = "auditoria_cabeceras" ]; then
            python auditar_cabeceras_censo.py
          else
            python calcular_censo_canal.py
          fi

      - name: Subir artefactos de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-censo-auditoria
          path: |
            censo_total_canal.json
            reporte_auditoria_canal_partes.json
            resultado_auditoria_cabeceras.json
