name: Censo y Auditoría Canal Partes

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a realizar'
        required: true
        default: 'auditar_multicanal'
        type: choice
        options:
          - 'auditar_multicanal'
          - 'borrar_multicanal'
          - 'censo_total'
          - 'auditoria_cabeceras'
          - 'borrar_incompatibles'
          - 'identificar_tres_canales'
      target:
        description: 'Canal objetivo (all, pelis_2000, pelis_clasicas, series)'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write

jobs:
  run_task:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install --upgrade --no-cache-dir "telethon>=1.40.0" requests

      - name: Ejecutar Tarea
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_BUNKER: ${{ secrets.SESSION_BUNKER }}
          SESSION_PROD: ${{ secrets.SESSION_PROD }}
          CHOSEN_ACTION: ${{ inputs.action }}
          CHOSEN_TARGET: ${{ inputs.target }}
        run: |
          if [ "$CHOSEN_ACTION" = "auditar_multicanal" ]; then
            python auditar_censo_multicanal.py
          elif [ "$CHOSEN_ACTION" = "borrar_multicanal" ]; then
            python borrar_incompatibles_multicanal.py
          elif [ "$CHOSEN_ACTION" = "identificar_tres_canales" ]; then
            python identificar_tres_canales.py
          elif [ "$CHOSEN_ACTION" = "auditoria_cabeceras" ]; then
            python auditar_cabeceras_censo.py
          elif [ "$CHOSEN_ACTION" = "borrar_incompatibles" ]; then
            python borrar_incompatibles_canal.py
          else
            python calcular_censo_canal.py
          fi

      - name: Subir artefactos de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-censo-auditoria
          path: |
            censo_total_canal.json
            reporte_auditoria_canal_partes.json
            resultado_auditoria_cabeceras.json
            reporte_auditoria_multicanal.json
            ids_a_borrar_multicanal.json
