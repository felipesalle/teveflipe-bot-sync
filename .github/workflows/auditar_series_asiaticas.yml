name: Auditar Series Asiaticas

on:
  workflow_dispatch:

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install telethon

      - name: Ejecutar Auditoría de Series Asiáticas
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TARGET_CHAT_ID: '-1002160549536'
          TOPIC_ID: '10'
        run: |
          python auditar_series_asiaticas.py

      - name: Guardar Reporte de Auditoría
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add auditoria_series_asiaticas.json AUDITORIA_SERIES_ASIATICAS.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Generar reporte de auditoria de Series Asiaticas [skip ci]" && git push)
