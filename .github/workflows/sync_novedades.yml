name: Escáner de Novedades y Avisos Comunidad

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas en la nube (consumo de ~180 min/mes de 2.000 disponibles)
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check_novedades:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install telethon requests

      - name: Ejecutar Escáner de Novedades
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_BUNKER: ${{ secrets.SESSION_BUNKER }}
          SESSION_PROD: ${{ secrets.SESSION_PROD }}
          COMMUNITY_GROUP_ID: "-1003990716596"
          COMMUNITY_TOPIC_ID: "22"
          CHUNK_SIZE: "5"
        run: |
          python sync_novedades_global.py

      - name: Guardar estado si hubo novedades
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f canales_map.json ]; then
            git add canales_map.json
            if ! git diff --staged --quiet; then
              git commit -m "auto: actualizar ultimo_id novedades [skip ci]"
              git pull --rebase --autostash origin main
              git push origin main
            fi
          fi
