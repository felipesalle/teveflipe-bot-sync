name: Organizador Inteligente de Series TV

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo Dry-Run (solo análisis y reporte sin modificar Telegram)'
        required: true
        type: boolean
        default: true
      series_to_sync:
        description: 'Series específicas a sincronizar (separadas por coma, o vacío para todas)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install telethon

      - name: Ejecutar Organizador de Series
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TMDB_API_KEY: "2b7cd7b237fe99884613b230a910a09c"
          SERIES_SOURCE_CHAT: "-1002257262928"
          SERIES_SOURCE_TOPIC: "157592"
          SERIES_DEST_CHAT: "-1002097175258"
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            FLAGS="--execute"
          fi
          if [ -n "${{ inputs.series_to_sync }}" ]; then
            FLAGS="$FLAGS --series=\"${{ inputs.series_to_sync }}\""
          fi
          python organizador_series.py $FLAGS

      - name: Guardar Reporte y Caché
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PROPUESTA_SERIES_TV.md propuesta_series_tv.json dudosos.txt tmdb_series_cache.json || true
          git commit -m "Actualizar propuesta y analisis de Series TV [skip ci]" || exit 0
          git pull --rebase origin main
          git push

      - name: Subir Artefactos de Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-series-tv
          path: |
            PROPUESTA_SERIES_TV.md
            propuesta_series_tv.json
            dudosos.txt
            tmdb_series_cache.json
          if-no-files-found: ignore
