name: Escanear Catalogo de Series

on:
  workflow_dispatch: # Ejecución manual con un clic

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Escanear Catalogo
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          SERIES_SOURCE_CHAT: "-1002257262928"
          SERIES_SOURCE_TOPIC: "157592"
        run: |
          python escanear_catalogo.py

      - name: Guardar Catalogo Generado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo_series.json CATALOGO_SERIES.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar catalogo de series detectadas [skip ci]" && git push)
