name: Sincronizar Zona Infantil (Peliculas y Series)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-session
  cancel-in-progress: false

jobs:
  sync_infantil:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Sincronización Infantil
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          INFANTIL_SOURCE_CHAT: "-1002257262928"
          INFANTIL_SOURCE_TOPIC: "316308"
        run: |
          python sync_infantil.py

      - name: Guardar progreso y canales creados
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f checkpoint_infantil.json ]; then
            git add checkpoint_infantil.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update checkpoint infantil [skip ci]"
              git pull --rebase --autostash origin main
              git push origin main
            fi
          fi
